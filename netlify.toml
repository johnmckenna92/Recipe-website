[build]
  publish = "."
  functions = "netlify/functions"

# Explicitly route /api/generate-ai and /.netlify/functions/generate-ai to the serverless engine
[[redirects]]
  from = "/api/generate-ai"
  to = "/.netlify/functions/generate-ai"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
